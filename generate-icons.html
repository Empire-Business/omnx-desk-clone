<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EmpireDesk PWA Icon Generator</title>
  <style>
    body { font-family: Inter, sans-serif; background: #f2efe8; color: #1a1f2e; padding: 2rem; text-align: center; }
    h1 { margin-bottom: 0.5rem; }
    p { color: #243b55; margin-bottom: 2rem; }
    canvas { border: 1px solid #e4e2dc; border-radius: 12px; margin: 1rem; }
    button { background: #0d1829; color: #f2efe8; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: 0.5rem; }
    button:hover { background: #243b55; }
  </style>
</head>
<body>
  <h1>EmpireDesk PWA Icon Generator</h1>
  <p>Click the buttons below to download the PNG icons, then place them in <code>public/icons/</code></p>

  <div>
    <canvas id="c192" width="192" height="192"></canvas>
    <canvas id="c512" width="512" height="512"></canvas>
  </div>
  <div>
    <button onclick="download('c192', 'icon-192.png')">Download 192x192</button>
    <button onclick="download('c512', 'icon-512.png')">Download 512x512</button>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const s = canvas.width;
      const r = s * 0.18; // corner radius

      // Background — empire dark
      ctx.beginPath();
      ctx.roundRect(0, 0, s, s, r);
      ctx.fillStyle = '#0D1829';
      ctx.fill();

      // Gold accent line at top
      ctx.fillStyle = '#C9A240';
      ctx.fillRect(s * 0.15, s * 0.12, s * 0.7, s * 0.02);

      // "ED" text
      ctx.fillStyle = '#F2EFE8';
      ctx.font = `bold ${s * 0.38}px Inter, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ED', s / 2, s * 0.52);

      // "EmpireDesk" subtitle
      ctx.fillStyle = '#BFC5CC';
      ctx.font = `500 ${s * 0.08}px Inter, system-ui, sans-serif`;
      ctx.fillText('EmpireDesk', s / 2, s * 0.78);

      // Gold accent line at bottom
      ctx.fillStyle = '#C9A240';
      ctx.fillRect(s * 0.15, s * 0.86, s * 0.7, s * 0.02);
    }

    drawIcon(document.getElementById('c192'));
    drawIcon(document.getElementById('c512'));

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
