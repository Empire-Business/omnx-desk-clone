# Licença HTAI desta instalação: chamada pelo agendador (x-cron-secret conferido
# no Vault, sem JWT) e pela tela (JWT conferido dentro da função).
[functions.htai-licenca]
verify_jwt = false

# Exportar os dados da empresa (sempre aberta, mesmo com a licença negada):
# JWT e administração conferidos dentro da função.
[functions.htai-exportar]
verify_jwt = false

# Ponte de vendas CRM OMNX -> Desk: sem JWT; autorização só pela assinatura HMAC
# (X-OMNX-Signature com o segredo crm_omnx do tenant, conferido na função).
[functions.crm-venda-receber]
verify_jwt = false

# Ponte de vendas Desk -> CRM OMNX: chamada pelos gatilhos do banco com a chave anon
# (passa pelo gateway) e o x-notify-secret do Vault (autorização real, na função).
[functions.crm-omnx-notificar]
verify_jwt = true
