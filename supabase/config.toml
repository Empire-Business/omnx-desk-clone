# Provisionamento de empresa chamado máquina-a-máquina pela plataforma (Empire OS):
# a chamada não traz JWT de usuário, então a verificação automática é desligada e a
# autorização é feita DENTRO da função (X-Platform-Key OU JWT de master admin).
[functions.provision-tenant]
verify_jwt = false

# -- Funcoes que NAO podem verificar JWT no gateway --------------------------
# Cada uma faz a autorizacao por conta propria, por dentro: chave de servico
# (webhook/bot), segredo em header, ou validacao manual do token do usuario.
# Se o gateway verificar o JWT antes, ele rejeita a chamada com 401 e a funcao
# nem roda -- foi assim que o envio de mensagem ja caiu antes.
#
# Estavam configuradas so no servidor. Sem esta lista, um deploy pela CLI sem
# a flag --no-verify-jwt religa a verificacao e derruba a funcao em producao.
# Levantado do servidor em 19/08/2026.

